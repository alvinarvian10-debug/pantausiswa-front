<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PantauSiswa - Unified Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&amp;family=Inter:wght@400..700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
        theme: {
            fontFamily: {
                sans: ['Inter', 'sans-serif'],
                display: ['Geist', 'sans-serif'],
            }
        }
    }
</script>
<style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4, h5, h6 { font-family: 'Geist', sans-serif; }
</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 md:p-8 text-gray-900 overflow-hidden relative"><a class="absolute top-6 left-6 z-20 flex items-center gap-2 text-emerald-600 hover:text-emerald-500 transition-colors font-medium text-sm" href="{{DATA:SCREEN:SCREEN_15}}">
<span class="material-symbols-outlined text-xl">arrow_back</span>
<span>Kembali ke Beranda</span>
</a>
<!-- Decorative background elements for glassmorphism effect -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-emerald-200/40 rounded-full blur-3xl pointer-events-none"></div><div class="absolute top-[20%] right-[-5%] w-[30%] h-[30%] bg-emerald-100/30 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-[15%] left-[-5%] w-[35%] h-[35%] bg-blue-50/40 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-blue-100/40 rounded-full blur-3xl pointer-events-none"></div>
<!-- TopNavBar component intentionally suppressed as this is a login/transactional screen -->
<main class="w-full max-w-md relative z-10">
<div class="bg-white/70 backdrop-blur-md border border-white/40 shadow-sm rounded-2xl p-8 md:p-12 flex flex-col gap-8 shadow-lg">
<!-- Header Section -->
<div class="text-center space-y-2">
<div class="flex justify-center items-center gap-2 text-emerald-500 mb-4">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<h1 class="text-3xl font-semibold text-gray-900 tracking-tight">PantauSiswa</h1>
<div class="pt-2">
<h2 class="text-xl font-medium text-gray-900">Selamat Datang</h2>
<p class="text-sm text-gray-500 mt-1">Silakan masuk ke portal Anda</p>
</div>
</div>
<!-- Login Form -->
<form action="{{DATA:SCREEN:SCREEN_7}}" class="space-y-6" method="GET">
<div class="space-y-2">
<label class="text-sm font-medium text-gray-700 block" for="identifier">Email / NIS / NIP</label>
<input class="w-full rounded-xl border-gray-200 bg-white/50 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-gray-900 py-3 px-4 transition-all shadow-sm" id="identifier" name="identifier" placeholder="Masukkan ID Anda" required="" type="text"/>
</div>
<div class="space-y-2">
<label class="text-sm font-medium text-gray-700 block" for="password">Password</label>
<input class="w-full rounded-xl border-gray-200 bg-white/50 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-gray-900 py-3 px-4 transition-all shadow-sm" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="pt-2">
<button class="w-full bg-emerald-500 text-white rounded-xl py-3 px-6 text-sm font-medium transition-all duration-300 hover:bg-emerald-600 hover:shadow-lg hover:-translate-y-1 active:scale-95" type="submit">
                        Masuk
                    </button>
</div>
<div class="text-center mt-4">
<a class="text-xs text-emerald-500 hover:text-emerald-600 font-medium transition-colors" href="#">
                        Lupa Password?
                    </a>
</div>
</form>
<!-- Demo Routing Section -->
<div class="mt-8 pt-6 border-t border-gray-100/50">
<h3 class="text-xs font-medium text-gray-400 uppercase tracking-wider mb-4 text-center">Mode Demo</h3>
<div class="grid grid-cols-3 gap-3">
<a class="flex items-center justify-center bg-white/50 border border-emerald-100 text-emerald-600 rounded-xl py-2.5 text-xs font-medium hover:bg-emerald-50 hover:border-emerald-200 transition-colors text-center shadow-sm" href="{{DATA:SCREEN:SCREEN_8}}">
                        Siswa
                    </a>
<a class="flex items-center justify-center bg-white/50 border border-emerald-100 text-emerald-600 rounded-xl py-2.5 text-xs font-medium hover:bg-emerald-50 hover:border-emerald-200 transition-colors text-center shadow-sm" href="{{DATA:SCREEN:SCREEN_9}}">
                        Guru
                    </a>
<a class="flex items-center justify-center bg-white/50 border border-emerald-100 text-emerald-600 rounded-xl py-2.5 text-xs font-medium hover:bg-emerald-50 hover:border-emerald-200 transition-colors text-center shadow-sm" href="{{DATA:SCREEN:SCREEN_7}}">
                        Admin
                    </a>
</div>
</div>
</div>
</main>
<!-- Footer component intentionally suppressed as this is a focused login screen -->
</body></html>
